[project]
name = "lipreadle-pipeline"
version = "0.0.0"
description = "Builds the Lipreadle clip bank from pronunciation videos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cmudict>=1.1.3",
    "mediapipe>=0.10.14,<0.11",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "wordfreq>=3.1",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
lipreadle = "lipreadle_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lipreadle_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
